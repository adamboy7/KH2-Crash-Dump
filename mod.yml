title: KH2 Crash Dump
originalAuthor: adamboy7
description: When the game crashes, writes a crash dump (KH2Crash-<date>-<time>.dmp) and a crash log (KH2Crash.log) to the game's install folder, for finding out what crashed. Keeps the last 5 dumps.
